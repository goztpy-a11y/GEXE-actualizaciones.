name: Build and release GEXE Windows 1.1.6 trial clock fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/gexe-windows-1-1-6.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download verified 1.1.5 source
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/source.zip"
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/recuperacion/windows-1.1.5/GEXE-Codigo-Recuperado-1.1.5.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '67b702aa2496893ccc296c04f70e578736fa3b103d021741a74de27d0639f9aa') { throw 'Source checksum mismatch' }
          Expand-Archive $zip -DestinationPath source
      - name: Apply trial correction and increment version
        shell: pwsh
        run: |
          $file = 'source/windows/App/GOZT.Excel/TrialService.cs'
          $s = [IO.File]::ReadAllText((Resolve-Path $file))
          $old = 'record.DeviceHash != deviceHash || record.StartedUtc > record.LastSeenUtc || dateTimeOffset < record.LastSeenUtc.AddMinutes(-2.0)'
          if (!$s.Contains($old)) { throw 'Trial source changed unexpectedly' }
          $s = $s.Replace($old,'record.DeviceHash != deviceHash || record.StartedUtc > record.LastSeenUtc')
          $oldBlock = 'if (utc() < record.LastSeenUtc.AddMinutes(-2.0))'
          if (!$s.Contains($oldBlock)) { throw 'Second trial clock guard missing' }
          $s = [regex]::Replace($s,'(?s)\s*if \(utc\(\) < record\.LastSeenUtc\.AddMinutes\(-2\.0\)\)\s*\{\s*record\.Blocked = true;\s*\}','')
          [IO.File]::WriteAllText((Resolve-Path $file),$s)
          foreach($p in @('source/windows/App/Properties/AssemblyInfo.cs','source/windows/Installer/Properties/AssemblyInfo.cs')) {
            $v = [IO.File]::ReadAllText((Resolve-Path $p))
            if (!$v.Contains('1.1.5')) { throw "Version missing in $p" }
            [IO.File]::WriteAllText((Resolve-Path $p),$v.Replace('1.1.5','1.1.6'))
          }
          $b='source/windows/build.ps1'
          $build=[IO.File]::ReadAllText((Resolve-Path $b))
          [IO.File]::WriteAllText((Resolve-Path $b),$build.Replace('GEXE-Update-1.1.5.zip','GEXE-Update-1.1.6.zip'))
      - name: Run checks and build installer
        shell: pwsh
        run: |
          & ./source/windows/build.ps1
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Verify installer payload
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP/extracted"
          $setup = Resolve-Path 'source/windows/artifacts/setup/GEXE-Setup.exe'
          $proc = Start-Process $setup -ArgumentList '--extract', $target -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Installer extraction failed' }
          Get-ChildItem 'source/windows/artifacts/app' -File | Where-Object Extension -ne '.pdb' | ForEach-Object {
            $dest=Join-Path $target $_.Name
            if (!(Test-Path $dest) -or (Get-FileHash $_.FullName).Hash -ne (Get-FileHash $dest).Hash) { throw "Installer mismatch: $($_.Name)" }
          }
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.6 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published' }
          New-Item -ItemType Directory release | Out-Null
          Copy-Item 'source/windows/artifacts/GEXE-Update-1.1.6.zip' 'release/GEXE-Update.zip'
          $file=Get-Item 'release/GEXE-Update.zip'
          @{
            product='GEXE'; enabled=$true; version='1.1.6'
            downloadUrl="https://github.com/$env:GITHUB_REPOSITORY/releases/download/v1.1.6/GEXE-Update.zip"
            notes='Corrección del bloqueo prematuro por ajuste del reloj de Windows. Conserva libros y licencias. Cerrá GEXE, extraé el ZIP y ejecutá GEXE-Setup.exe.'
            sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            sizeBytes=$file.Length
          } | ConvertTo-Json | Set-Content release/gexe-update.json -Encoding utf8NoBOM
          gh release create v1.1.6 release/GEXE-Update.zip release/gexe-update.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'GEXE Windows 1.1.6 · Corrección de prueba' --notes 'Corrige el bloqueo prematuro por retroceso del reloj. No reinicia pruebas ni modifica libros. La instalación requiere confirmación.' --latest
          if ($LASTEXITCODE) { throw 'Release failed' }
